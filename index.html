<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Creator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Blue-Black Animated Background */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #000814, #021124, #0b2545, #000814);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      color: #ffffff;
      padding: 40px 20px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Glass Container - larger, responsive layout */
    .container {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(14,165,233,0.08);
      border-radius: 20px;
      padding: 60px 50px;
      max-width: 1000px; /* bigger layout */
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
      transform: translateY(20px);
      opacity: 0;
      animation: containerEntry 0.9s ease forwards;
    }

    @keyframes containerEntry {
      to { transform: translateY(0); opacity: 1; }
    }

    /* Left column (controls) */
    .controls {
      text-align: left;
    }

    /* Right column (QR display) */
    .qr-area {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      /* Neon Blue Gradient Text */
      background: linear-gradient(90deg, #60a5fa, #1e3a8a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.05;
      transform: translateX(-20px);
      opacity: 0;
      transition: transform 0.6s ease, opacity 0.6s ease;
    }

    p.subtitle {
      color: #cbd5e1;
      margin-bottom: 30px;
      font-size: 1.15rem;
      transform: translateX(-20px);
      opacity: 0;
      transition: transform 0.6s ease 0.05s, opacity 0.6s ease 0.05s;
    }

    /* Input Field */
    input[type="text"] {
      width: 100%;
      padding: 18px;
      border-radius: 12px;
      border: 2px solid #1e3a8a;
      background: rgba(0, 0, 0, 0.35);
      color: white;
      font-size: 1.15rem;
      margin-bottom: 20px;
      outline: none;
      transition: 0.3s;
      transform: translateY(20px);
      opacity: 0;
    }

    input[type="text"]:focus {
      box-shadow: 0 0 20px rgba(96,165,250,0.35);
      border-color: #60a5fa;
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 1.15rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-bottom: 20px;
      transform: translateY(20px);
      opacity: 0;
    }

    .generate-btn {
      background: linear-gradient(90deg, #60a5fa, #1e3a8a);
      color: white;
    }

    .generate-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(96,165,250,0.25);
    }

    .download-btn {
      background: linear-gradient(90deg, #38bdf8, #0369a1);
      color: white;
      display: none; /* Hidden until QR code is made */
    }

    .download-btn:hover {
      background: linear-gradient(90deg, #7dd3fc, #0284c7);
      transform: translateY(-3px);
    }

    /* QR Code Display Area */
    #qr-box {
      background: white;
      padding: 26px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 20px;
      display: none; /* Hidden initially */
      transform: scale(0.95) translateY(20px);
      opacity: 0;
      transition: transform 0.45s ease, opacity 0.45s ease;
    }
    
    /* Make sure the generated image fits */
    #qr-box img, #qr-box canvas {
      max-width: 100%;
      height: auto;
      margin: 0 auto;
      display: block;
    }

    /* Error styling */
    .error {
      color: #ff6b6b;
      font-weight: 700;
      font-size: 2rem;
      padding: 18px 24px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 107, 107, 0.12);
    }

    /* Animation helpers for scroll/slide-in */
    [data-animate] { will-change: transform, opacity; }
    [data-animate].in-view { transform: translateY(0) translateX(0) scale(1); opacity: 1; }

    .slide-left { transform: translateX(-30px); opacity: 0; }
    .slide-right { transform: translateX(30px); opacity: 0; }
    .slide-up { transform: translateY(30px); opacity: 0; }
    .fade-in { opacity: 0; }

    /* When they become visible */
    .slide-left.in-view, .slide-right.in-view, .slide-up.in-view, .fade-in.in-view {
      transform: translateX(0) translateY(0) scale(1);
      opacity: 1;
      transition: transform 0.6s cubic-bezier(.22,.9,.35,1), opacity 0.6s ease;
    }

    /* Responsive adjustments */
    @media (max-width: 820px) {
      .container {
        grid-template-columns: 1fr;
        padding: 40px 25px;
      }

      h1 { font-size: 2.4rem; }
      input[type="text"], .btn { font-size: 1.05rem; }
    }

  </style>
</head>
<body>

  <div class="container">
    <div class="controls">
      <h1 data-animate class="slide-left">📱 QR Code Creator</h1>
      <p class="subtitle" data-animate class="slide-left">Paste a link or text below to generate</p>

      <input type="text" id="qr-input" placeholder="e.g., https://youtube.com" data-animate class="slide-up">
      
      <button class="btn generate-btn" id="generateBtn" data-animate class="slide-up">Generate QR Code</button>

      <button class="btn download-btn" id="downloadBtn" data-animate class="fade-in">Download QR Code</button>
    </div>

    <div class="qr-area">
      <div id="qr-box" data-animate class="slide-right"></div>
      <p style="color:#cbd5e1; font-size:0.95rem; margin-top:12px; opacity:0.85;" data-animate class="slide-right">Generated image will appear here. Scroll to reveal animations.</p>
    </div>
  </div>

  <script>
    // IntersectionObserver to add animations on scroll (scroll animation)
    const observer = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          obs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });

    document.querySelectorAll('[data-animate]').forEach(el => observer.observe(el));

    const qrInput = document.getElementById('qr-input');
    const generateBtn = document.getElementById('generateBtn');
    const qrBox = document.getElementById('qr-box');
    const downloadBtn = document.getElementById('downloadBtn');

    function isValidURL(str) {
      try {
        const url = new URL(str);
        return url.protocol === 'http:' || url.protocol === 'https:';
      } catch (e) {
        return false;
      }
    }

    function showError() {
      qrBox.innerHTML = '<div class="error">ERROR</div>';
      qrBox.style.display = 'inline-block';
      downloadBtn.style.display = 'none';
      qrBox.classList.add('in-view');
    }

    // Function to generate the QR Code
    generateBtn.addEventListener('click', () => {
      const text = qrInput.value.trim();
      
      // Stop if the input is empty
      if (!text) {
        alert("Please enter a link or some text first!");
        return;
      }

      // If the input looks like a link (starts with http/https), validate its format
      const looksLikeLink = text.startsWith('http://') || text.startsWith('https://');
      if (looksLikeLink && !isValidURL(text)) {
        showError();
        return;
      }

      // Clear any old QR code
      qrBox.innerHTML = '';
      qrBox.style.display = 'inline-block';

      // Generate new QR code using the library (bigger size) with blue-black dark color
      new QRCode(qrBox, {
        text: text,
        width: 350,
        height: 350,
        colorDark : "#021124", // dark blue-black
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H // High error correction
      });

      // Show the Download button
      setTimeout(() => {
        downloadBtn.style.display = 'block';
        // animate the qr-box and download button into view if not already
        qrBox.classList.add('in-view');
        downloadBtn.classList.add('in-view');
      }, 120);

      // Ensure observer will animate qr-box if needed
      try { observer.observe(qrBox); } catch (e) {}
    });

    // Function to download the QR Code
    downloadBtn.addEventListener('click', () => {
      // The library creates an <img> or <canvas> tag inside our qr-box
      const qrImage = qrBox.querySelector('img');
      const qrCanvas = qrBox.querySelector('canvas');
      
      const link = document.createElement('a');
      link.download = 'My-QR-Code.png';

      // Check which element the library generated and grab its image data
      if (qrImage && qrImage.src) {
        link.href = qrImage.src;
      } else if (qrCanvas) {
        link.href = qrCanvas.toDataURL("image/png");
      }

      link.click();
    });
  </script>
</body>
</html>
